name: privdot CI

on:
  push:
    branches: [ main, "**" ]
  pull_request:
    branches: [ main ]

jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run core unit tests (ASan + UBSan)
        run: make test

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build and run core unit tests (MSVC)
        shell: cmd
        run: cl /nologo /std:c++17 /EHsc /W4 /WX src/core/consent_parser.cpp tests/test_core.cpp /Fe:test_core.exe && test_core.exe
      - name: Build privdot.exe (MSVC)
        shell: cmd
        run: cl /nologo /std:c++17 /O1 /EHsc /W4 /WX /DUNICODE /D_UNICODE /D_WIN32_WINNT=0x0A00 /DWINVER=0x0A00 src/core/consent_parser.cpp src/win32/consent_reader.cpp src/win32/consent_watcher.cpp src/win32/audio_mute.cpp src/win32/tray_app.cpp src/win32/main.cpp advapi32.lib ole32.lib shell32.lib user32.lib gdi32.lib /Fe:privdot.exe /link /SUBSYSTEM:WINDOWS
      - name: Upload privdot.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: privdot-win64
          path: privdot.exe
